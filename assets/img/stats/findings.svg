<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 676" width="1200" height="676" font-family="Arial, Helvetica, sans-serif">
<title>UK air conditioning in numbers, 2027. Chart by CoolIn, cool-in.co.uk/air-conditioning-statistics-2027</title>
<rect width="1200" height="676" fill="#FFFFFF"/><rect width="1200" height="8" fill="#0E6E96"/>
<text x="48" y="68" font-size="34" font-weight="700" fill="#12262F">UK air conditioning in numbers, 2027</text><text x="48" y="100" font-size="19" fill="#41606E">Who has it, who goes without, and what changes next year</text>
<g transform="translate(0,130)"><text x="48" y="64" font-size="52" font-weight="700" letter-spacing="-1" fill="#E2673B">4.3%</text>
<text x="48" y="98" font-size="18" fill="#41606E">of homes in England use</text><text x="48" y="122" font-size="18" fill="#41606E">air conditioning. About</text><text x="48" y="147" font-size="18" fill="#41606E">1.06 million.</text>
<line x1="324" x2="324" y1="18" y2="185" stroke="#E1EAEF" stroke-width="2"/>
<text x="346" y="64" font-size="52" font-weight="700" letter-spacing="-1" fill="#0D2B38">2.5%</text>
<text x="346" y="98" font-size="18" fill="#41606E">in the North West,</text><text x="346" y="122" font-size="18" fill="#41606E">including Manchester.</text><text x="346" y="147" font-size="18" fill="#41606E">Roughly 80,000 homes.</text><text x="346" y="172" font-size="18" fill="#41606E">London: 6.5%.</text>
<line x1="600" x2="600" y1="18" y2="185" stroke="#E1EAEF" stroke-width="2"/>
<text x="622" y="64" font-size="52" font-weight="700" letter-spacing="-1" fill="#0D2B38">125,000</text>
<text x="622" y="98" font-size="18" fill="#41606E">more North West homes</text><text x="622" y="122" font-size="18" fill="#41606E">would have it at London&#x27;s</text><text x="622" y="147" font-size="18" fill="#41606E">rate.</text>
<line x1="876" x2="876" y1="18" y2="185" stroke="#E1EAEF" stroke-width="2"/>
<text x="898" y="64" font-size="52" font-weight="700" letter-spacing="-1" fill="#0D2B38">7 in 10</text>
<text x="898" y="98" font-size="18" fill="#41606E">of the North West&#x27;s</text><text x="898" y="122" font-size="18" fill="#41606E">warmest summers since</text><text x="898" y="147" font-size="18" fill="#41606E">1884 came in 2003 or</text><text x="898" y="172" font-size="18" fill="#41606E">later.</text>
<line x1="48" x2="1152" y1="199" y2="199" stroke="#E1EAEF" stroke-width="2"/>
<text x="48" y="263" font-size="52" font-weight="700" letter-spacing="-1" fill="#0D2B38">7%</text>
<text x="48" y="297" font-size="18" fill="#41606E">of households whose home</text><text x="48" y="322" font-size="18" fill="#41606E">overheated used air</text><text x="48" y="347" font-size="18" fill="#41606E">conditioning. 90% opened</text><text x="48" y="371" font-size="18" fill="#41606E">a window.</text>
<line x1="324" x2="324" y1="217" y2="410" stroke="#E1EAEF" stroke-width="2"/>
<text x="346" y="263" font-size="52" font-weight="700" letter-spacing="-1" fill="#0D2B38">3x</text>
<text x="346" y="297" font-size="18" fill="#41606E">as likely to have it in</text><text x="346" y="322" font-size="18" fill="#41606E">the richest fifth of</text><text x="346" y="347" font-size="18" fill="#41606E">homes as the poorest:</text><text x="346" y="371" font-size="18" fill="#41606E">8.2% against 2.5%.</text>
<line x1="600" x2="600" y1="217" y2="410" stroke="#E1EAEF" stroke-width="2"/>
<text x="622" y="263" font-size="52" font-weight="700" letter-spacing="-1" fill="#0D2B38">1.68m</text>
<text x="622" y="297" font-size="18" fill="#41606E">homes in England could be</text><text x="622" y="322" font-size="18" fill="#41606E">using it by summer 2027.</text><text x="622" y="347" font-size="18" fill="#41606E">Up to 1 in 15.</text>
<line x1="876" x2="876" y1="217" y2="410" stroke="#E1EAEF" stroke-width="2"/>
<text x="898" y="263" font-size="52" font-weight="700" letter-spacing="-1" fill="#0D2B38">No ban</text>
<text x="898" y="297" font-size="18" fill="#41606E">on air conditioning in</text><text x="898" y="322" font-size="18" fill="#41606E">Great Britain in 2027.</text><text x="898" y="347" font-size="18" fill="#41606E">The EU&#x27;s applies in the</text><text x="898" y="371" font-size="18" fill="#41606E">EU and Northern Ireland</text><text x="898" y="396" font-size="18" fill="#41606E">only.</text></g>
<line x1="48" y1="576" x2="1152" y2="576" stroke="#E1EAEF" stroke-width="2"/>
<text x="48" y="606" font-size="16" fill="#6E8592">Source: EDRC analysis of the English Housing Survey 2023-24; English Housing Survey 2024 to 2025; Met Office HadUK-Grid; ONS</text><text x="48" y="628" font-size="16" fill="#6E8592">Census 2021; DEFRA; CoolIn projection</text>
<text x="48" y="651" font-size="16" font-weight="700" fill="#0E6E96">Chart by CoolIn, cool-in.co.uk/air-conditioning-statistics-2027</text>
</svg>
