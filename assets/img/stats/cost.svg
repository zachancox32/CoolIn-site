<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 510" width="1200" height="510" font-family="Arial, Helvetica, sans-serif">
<rect width="1200" height="510" fill="#FFFFFF"/>
<rect width="1200" height="8" fill="#0E6E96"/>
<text x="48" y="70" font-size="34" font-weight="700" fill="#12262F">What it costs to keep cool, per hour</text>
<text x="48" y="106" font-size="19" fill="#41606E">Running cost per hour at the October to December 2026 price cap of 26.32p per kWh</text>
<defs><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#FBE7DC"/><line x1="0" y1="0" x2="0" y2="10" stroke="#E2673B" stroke-width="4"/></pattern></defs>
<text x="454" y="175" font-size="19" font-weight="400" fill="#12262F" text-anchor="end">Portable air conditioner</text>
<rect x="470" y="156" width="530" height="26" rx="4" fill="#D7EDF7" opacity=".45"/>
<rect x="470" y="156" width="490.7" height="26" rx="4" fill="#0E6E96"/>
<text x="972.7" y="176" font-size="19" font-weight="700" fill="#12262F">26.3p</text>
<text x="454" y="221" font-size="19" font-weight="400" fill="#12262F" text-anchor="end">Split system, cooling a hot room down</text>
<rect x="470" y="202" width="530" height="26" rx="4" fill="#D7EDF7" opacity=".45"/>
<rect x="470" y="202" width="319.1" height="26" rx="4" fill="#0E6E96"/>
<text x="801.1" y="222" font-size="19" font-weight="700" fill="#12262F">17.1p</text>
<text x="454" y="267" font-size="19" font-weight="700" fill="#12262F" text-anchor="end">Split system, holding the room at temperature</text>
<rect x="470" y="248" width="530" height="26" rx="4" fill="#D7EDF7" opacity=".45"/>
<rect x="470" y="248" width="147.4" height="26" rx="4" fill="#E2673B"/>
<text x="629.4" y="268" font-size="19" font-weight="700" fill="#12262F">7.9p</text>
<text x="454" y="313" font-size="19" font-weight="400" fill="#12262F" text-anchor="end">Evaporative air cooler</text>
<rect x="470" y="294" width="530" height="26" rx="4" fill="#D7EDF7" opacity=".45"/>
<rect x="470" y="294" width="33.6" height="26" rx="4" fill="#0E6E96"/>
<text x="515.6" y="314" font-size="19" font-weight="700" fill="#12262F">1.8p</text>
<text x="454" y="359" font-size="19" font-weight="400" fill="#12262F" text-anchor="end">Electric fan</text>
<rect x="470" y="340" width="530" height="26" rx="4" fill="#D7EDF7" opacity=".45"/>
<rect x="470" y="340" width="20.5" height="26" rx="4" fill="#0E6E96"/>
<text x="502.5" y="360" font-size="19" font-weight="700" fill="#12262F">1.1p</text>
<text x="48" y="440" font-size="17" fill="#6E8592">Power figures are typical: 0.3 and 0.65kW for a 2.5kW split system, about 1kW for a portable unit, 70W for an air cooler and 40W for a fan. Check the label on your own appliance.</text>
<line x1="48" y1="458" x2="1152" y2="458" stroke="#E1EAEF" stroke-width="2"/>
<text x="48" y="488" font-size="16" fill="#6E8592">Source: Ofgem price cap, October 2026; CoolIn</text>
<text x="1152" y="488" font-size="16" font-weight="700" fill="#0E6E96" text-anchor="end">cool-in.co.uk/air-conditioning-statistics</text>
</svg>
