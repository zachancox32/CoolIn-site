<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 687" width="600" height="687" font-family="Arial, Helvetica, sans-serif">
<title>Homes reporting overheating in England. Chart by CoolIn, cool-in.co.uk/air-conditioning-statistics-2027</title>
<rect width="600" height="687" fill="#FFFFFF"/><rect width="600" height="8" fill="#0E6E96"/>
<text x="32" y="64" font-size="30" font-weight="700" fill="#12262F">Homes reporting overheating in</text><text x="32" y="99" font-size="30" font-weight="700" fill="#12262F">England</text><text x="32" y="132" font-size="19" fill="#41606E">Homes where the household reported the home getting</text><text x="32" y="157" font-size="19" fill="#41606E">uncomfortably hot, millions</text>
<g transform="translate(0,187)"><defs><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#FBE7DC"/><line x1="0" y1="0" x2="0" y2="10" stroke="#E2673B" stroke-width="4"/></pattern></defs>
<text x="32" y="20" font-size="20" font-weight="400" fill="#12262F">2019</text>
<rect x="32" y="30" width="329.6" height="26" rx="4" fill="#D7EDF7" opacity=".45"/>
<rect x="32" y="30" width="148.2" height="26" rx="4" fill="#0E6E96"/>
<text x="192.2" y="50" font-size="20" font-weight="700" fill="#12262F">1.7 million (7%)</text>
<text x="32" y="98" font-size="20" font-weight="700" fill="#12262F">2024</text>
<rect x="32" y="108" width="329.6" height="26" rx="4" fill="#D7EDF7" opacity=".45"/>
<rect x="32" y="108" width="261.6" height="26" rx="4" fill="#E2673B"/>
<text x="305.6" y="128" font-size="20" font-weight="700" fill="#12262F">3.0 million (12%)</text>
<text x="32" y="176" font-size="20" font-weight="400" fill="#12262F">2027 if the trend continues</text>
<rect x="32" y="186" width="329.6" height="26" rx="4" fill="#D7EDF7" opacity=".45"/>
<rect x="32" y="186" width="329.6" height="26" rx="4" fill="url(#hatch)" stroke="#E2673B" stroke-width="2"/>
<text x="373.6" y="206" font-size="20" font-weight="700" fill="#12262F">about 3.8 million</text></g>
<text x="32" y="448" font-size="17" fill="#6E8592">The 2027 bar is our straight line projection of the 2019 to</text><text x="32" y="472" font-size="17" fill="#6E8592">2024 rise, not an official figure. Overheating also depends</text><text x="32" y="496" font-size="17" fill="#6E8592">on how hot a given summer is.</text>
<line x1="32" y1="525" x2="568" y2="525" stroke="#E1EAEF" stroke-width="2"/>
<text x="32" y="556" font-size="17" fill="#6E8592">Source: English Housing Survey 2024 to 2025, MHCLG</text>
<text x="32" y="580" font-size="17" font-weight="700" fill="#0E6E96">Chart by CoolIn,</text><text x="32" y="603" font-size="17" font-weight="700" fill="#0E6E96">cool-in.co.uk/air-conditioning-statistics-2027</text>
<g transform="translate(32,614.5) scale(1.150)" fill="none" stroke="#0E6E96" stroke-width="1.6" stroke-linecap="round"><path d="M12 2v20"/><path d="M3.3 7 20.7 17"/><path d="M20.7 7 3.3 17"/><path d="M12 6 9.4 3.4M12 6l2.6-2.6M12 18l-2.6 2.6M12 18l2.6 2.6"/><path d="m17.1 9 3.2-.9M17.1 9l.9 3.2M6.9 15l-3.2.9M6.9 15 6 11.8"/><path d="m17.1 15 3.2.9M17.1 15l.9-3.2M6.9 9l-3.2-.9M6.9 9 6 12.2"/></g><text x="64" y="637.3499999999999" font-size="24" font-weight="900" letter-spacing="1" fill="#0D2B38">COOLIN</text>
</svg>
