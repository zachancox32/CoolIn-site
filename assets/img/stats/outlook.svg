<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 401" width="1200" height="401" font-family="Arial, Helvetica, sans-serif">
<title>Homes using air conditioning in England by summer 2027. Chart by CoolIn, cool-in.co.uk/air-conditioning-statistics-2027</title>
<rect width="1200" height="401" fill="#FFFFFF"/><rect width="1200" height="8" fill="#0E6E96"/>
<text x="48" y="68" font-size="34" font-weight="700" fill="#12262F">Homes using air conditioning in England by summer 2027</text><text x="48" y="100" font-size="19" fill="#41606E">Measured in 2023-24, and two projections for July 2027, millions of homes</text>
<g transform="translate(0,130)"><defs><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#FBE7DC"/><line x1="0" y1="0" x2="0" y2="10" stroke="#E2673B" stroke-width="4"/></pattern></defs>
<text x="454" y="25" font-size="19" font-weight="400" fill="#12262F" text-anchor="end">2023-24, measured</text>
<rect x="470" y="6" width="463.8" height="26" rx="4" fill="#D7EDF7" opacity=".45"/>
<rect x="470" y="6" width="292.7" height="26" rx="4" fill="#0E6E96"/>
<text x="774.7" y="26" font-size="19" font-weight="700" fill="#12262F">1.06 million (4.3%)</text>
<text x="454" y="71" font-size="19" font-weight="400" fill="#12262F" text-anchor="end">2027 at the pre 2020 pace</text>
<rect x="470" y="52" width="463.8" height="26" rx="4" fill="#D7EDF7" opacity=".45"/>
<rect x="470" y="52" width="378.3" height="26" rx="4" fill="url(#hatch)" stroke="#E2673B" stroke-width="2"/>
<text x="860.3" y="72" font-size="19" font-weight="700" fill="#12262F">1.37 million (5.6%)</text>
<text x="454" y="117" font-size="19" font-weight="400" fill="#12262F" text-anchor="end">2027 at twice that pace</text>
<rect x="470" y="98" width="463.8" height="26" rx="4" fill="#D7EDF7" opacity=".45"/>
<rect x="470" y="98" width="463.8" height="26" rx="4" fill="url(#hatch)" stroke="#E2673B" stroke-width="2"/>
<text x="945.8" y="118" font-size="19" font-weight="700" fill="#12262F">1.68 million (6.8%)</text></g>
<text x="48" y="294" font-size="16" fill="#6E8592">Projections are CoolIn&#x27;s, built from the measured figure and the 2013 to 2020 installation rate. The full method is on the page.</text>
<line x1="48" y1="323" x2="1152" y2="323" stroke="#E1EAEF" stroke-width="2"/>
<text x="48" y="353" font-size="16" fill="#6E8592">Source: EDRC analysis of the English Housing Survey 2023-24</text>
<text x="48" y="375" font-size="16" font-weight="700" fill="#0E6E96">Chart by CoolIn, cool-in.co.uk/air-conditioning-statistics-2027</text>
</svg>
