<text x="48" y="70" font-size="34" font-weight="700" fill="#12262F">Which homes overheat</text>
<text x="48" y="106" font-size="19" fill="#41606E">Share of homes in England reported as overheating in 2024, by type of home</text>
<defs><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#FBE7DC"/><line x1="0" y1="0" x2="0" y2="10" stroke="#E2673B" stroke-width="4"/></pattern></defs>
<text x="454" y="175" font-size="19" font-weight="700" fill="#12262F" text-anchor="end">Detached house</text>
