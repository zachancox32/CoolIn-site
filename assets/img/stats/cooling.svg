<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" font-family="Arial, Helvetica, sans-serif">
<title>How people cooled down when their home overheated. Chart by CoolIn, cool-in.co.uk/air-conditioning-statistics-2027</title>
<rect width="1200" height="460" fill="#FFFFFF"/><rect width="1200" height="8" fill="#0E6E96"/>
<text x="48" y="68" font-size="34" font-weight="700" fill="#12262F">How people cooled down when their home overheated</text><text x="48" y="100" font-size="19" fill="#41606E">Methods used by the 3 million households in England whose home got uncomfortably hot, 2024-25</text>
<g transform="translate(0,130)"><defs><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#FBE7DC"/><line x1="0" y1="0" x2="0" y2="10" stroke="#E2673B" stroke-width="4"/></pattern></defs>
<text x="454" y="25" font-size="19" font-weight="400" fill="#12262F" text-anchor="end">Opened windows</text>
<rect x="470" y="6" width="634.1" height="26" rx="4" fill="#D7EDF7" opacity=".45"/>
<rect x="470" y="6" width="634.1" height="26" rx="4" fill="#0E6E96"/>
<text x="1116.1" y="26" font-size="19" font-weight="700" fill="#12262F">90%</text>
<text x="454" y="71" font-size="19" font-weight="400" fill="#12262F" text-anchor="end">Closed curtains, blinds or shutters</text>
<rect x="470" y="52" width="634.1" height="26" rx="4" fill="#D7EDF7" opacity=".45"/>
<rect x="470" y="52" width="528.4" height="26" rx="4" fill="#0E6E96"/>
<text x="1010.4" y="72" font-size="19" font-weight="700" fill="#12262F">75%</text>
<text x="454" y="117" font-size="19" font-weight="400" fill="#12262F" text-anchor="end">Switched on a fan</text>
<rect x="470" y="98" width="634.1" height="26" rx="4" fill="#D7EDF7" opacity=".45"/>
<rect x="470" y="98" width="415.7" height="26" rx="4" fill="#0E6E96"/>
<text x="897.7" y="118" font-size="19" font-weight="700" fill="#12262F">59%</text>
<text x="454" y="163" font-size="19" font-weight="700" fill="#12262F" text-anchor="end">Used air conditioning</text>
<rect x="470" y="144" width="634.1" height="26" rx="4" fill="#D7EDF7" opacity=".45"/>
<rect x="470" y="144" width="49.3" height="26" rx="4" fill="#E2673B"/>
<text x="531.3" y="164" font-size="19" font-weight="700" fill="#12262F">7%</text>
<text x="454" y="209" font-size="19" font-weight="400" fill="#12262F" text-anchor="end">Put out an awning or canopy</text>
<rect x="470" y="190" width="634.1" height="26" rx="4" fill="#D7EDF7" opacity=".45"/>
<rect x="470" y="190" width="21.1" height="26" rx="4" fill="#0E6E96"/>
<text x="503.1" y="210" font-size="19" font-weight="700" fill="#12262F">3%</text></g>
<line x1="48" y1="382" x2="1152" y2="382" stroke="#E1EAEF" stroke-width="2"/>
<text x="48" y="412" font-size="16" fill="#6E8592">Source: English Housing Survey 2024 to 2025, MHCLG</text>
<text x="48" y="435" font-size="16" font-weight="700" fill="#0E6E96">Chart by CoolIn, cool-in.co.uk/air-conditioning-statistics-2027</text>
</svg>
