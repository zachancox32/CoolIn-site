<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 761" width="600" height="761" font-family="Arial, Helvetica, sans-serif">
<title>How people cooled down when their home overheated. Chart by CoolIn, cool-in.co.uk/air-conditioning-statistics</title>
<rect width="600" height="761" fill="#FFFFFF"/><rect width="600" height="8" fill="#0E6E96"/>
<text x="32" y="64" font-size="30" font-weight="700" fill="#12262F">How people cooled down when their</text><text x="32" y="99" font-size="30" font-weight="700" fill="#12262F">home overheated</text><text x="32" y="132" font-size="19" fill="#41606E">Methods used by the 3 million households in England</text><text x="32" y="157" font-size="19" fill="#41606E">whose home got uncomfortably hot, 2024-25</text>
<g transform="translate(0,187)"><defs><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#FBE7DC"/><line x1="0" y1="0" x2="0" y2="10" stroke="#E2673B" stroke-width="4"/></pattern></defs>
<text x="32" y="20" font-size="20" font-weight="400" fill="#12262F">Opened windows</text>
<rect x="32" y="30" width="486.4" height="26" rx="4" fill="#D7EDF7" opacity=".45"/>
<rect x="32" y="30" width="486.4" height="26" rx="4" fill="#0E6E96"/>
<text x="530.4" y="50" font-size="20" font-weight="700" fill="#12262F">90%</text>
<text x="32" y="98" font-size="20" font-weight="400" fill="#12262F">Closed curtains, blinds or shutters</text>
<rect x="32" y="108" width="486.4" height="26" rx="4" fill="#D7EDF7" opacity=".45"/>
<rect x="32" y="108" width="405.3" height="26" rx="4" fill="#0E6E96"/>
<text x="449.3" y="128" font-size="20" font-weight="700" fill="#12262F">75%</text>
<text x="32" y="176" font-size="20" font-weight="400" fill="#12262F">Switched on a fan</text>
<rect x="32" y="186" width="486.4" height="26" rx="4" fill="#D7EDF7" opacity=".45"/>
<rect x="32" y="186" width="318.9" height="26" rx="4" fill="#0E6E96"/>
<text x="362.9" y="206" font-size="20" font-weight="700" fill="#12262F">59%</text>
<text x="32" y="254" font-size="20" font-weight="700" fill="#12262F">Used air conditioning</text>
<rect x="32" y="264" width="486.4" height="26" rx="4" fill="#D7EDF7" opacity=".45"/>
<rect x="32" y="264" width="37.8" height="26" rx="4" fill="#E2673B"/>
<text x="81.8" y="284" font-size="20" font-weight="700" fill="#12262F">7%</text>
<text x="32" y="332" font-size="20" font-weight="400" fill="#12262F">Put out an awning or canopy</text>
<rect x="32" y="342" width="486.4" height="26" rx="4" fill="#D7EDF7" opacity=".45"/>
<rect x="32" y="342" width="16.2" height="26" rx="4" fill="#0E6E96"/>
<text x="60.2" y="362" font-size="20" font-weight="700" fill="#12262F">3%</text></g>
<line x1="32" y1="599" x2="568" y2="599" stroke="#E1EAEF" stroke-width="2"/>
<text x="32" y="630" font-size="17" fill="#6E8592">Source: English Housing Survey 2024 to 2025, MHCLG</text>
<text x="32" y="654" font-size="17" font-weight="700" fill="#0E6E96">Chart by CoolIn, cool-in.co.uk/air-conditioning-statistics</text>
