<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 629" width="600" height="629" font-family="Arial, Helvetica, sans-serif">
<title>Homes using air conditioning in England by summer 2027. Chart by CoolIn, cool-in.co.uk/air-conditioning-statistics-2027</title>
<rect width="600" height="629" fill="#FFFFFF"/><rect width="600" height="8" fill="#0E6E96"/>
<text x="32" y="64" font-size="30" font-weight="700" fill="#12262F">Homes using air conditioning in</text><text x="32" y="99" font-size="30" font-weight="700" fill="#12262F">England by summer 2027</text><text x="32" y="132" font-size="19" fill="#41606E">Measured in 2023-24, and two projections for July</text><text x="32" y="157" font-size="19" fill="#41606E">2027, millions of homes</text>
<g transform="translate(0,187)"><defs><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#FBE7DC"/><line x1="0" y1="0" x2="0" y2="10" stroke="#E2673B" stroke-width="4"/></pattern></defs>
<text x="32" y="20" font-size="20" font-weight="400" fill="#12262F">2023-24, measured</text>
<rect x="32" y="30" width="307.2" height="26" rx="4" fill="#D7EDF7" opacity=".45"/>
<rect x="32" y="30" width="193.8" height="26" rx="4" fill="#0E6E96"/>
<text x="237.8" y="50" font-size="20" font-weight="700" fill="#12262F">1.06 million (4.3%)</text>
<text x="32" y="98" font-size="20" font-weight="400" fill="#12262F">2027 at the pre 2020 pace</text>
<rect x="32" y="108" width="307.2" height="26" rx="4" fill="#D7EDF7" opacity=".45"/>
<rect x="32" y="108" width="250.5" height="26" rx="4" fill="url(#hatch)" stroke="#E2673B" stroke-width="2"/>
<text x="294.5" y="128" font-size="20" font-weight="700" fill="#12262F">1.37 million (5.6%)</text>
<text x="32" y="176" font-size="20" font-weight="400" fill="#12262F">2027 at twice that pace</text>
<rect x="32" y="186" width="307.2" height="26" rx="4" fill="#D7EDF7" opacity=".45"/>
<rect x="32" y="186" width="307.2" height="26" rx="4" fill="url(#hatch)" stroke="#E2673B" stroke-width="2"/>
<text x="351.2" y="206" font-size="20" font-weight="700" fill="#12262F">1.68 million (6.8%)</text></g>
<text x="32" y="448" font-size="17" fill="#6E8592">Projections are CoolIn&#x27;s, built from the measured figure</text><text x="32" y="472" font-size="17" fill="#6E8592">and the 2013 to 2020 installation rate. The full method is</text><text x="32" y="496" font-size="17" fill="#6E8592">on the page.</text>
<line x1="32" y1="525" x2="568" y2="525" stroke="#E1EAEF" stroke-width="2"/>
<text x="32" y="556" font-size="17" fill="#6E8592">Source: EDRC analysis of the English Housing Survey 2023-24</text>
<text x="32" y="580" font-size="17" font-weight="700" fill="#0E6E96">Chart by CoolIn,</text><text x="32" y="603" font-size="17" font-weight="700" fill="#0E6E96">cool-in.co.uk/air-conditioning-statistics-2027</text>
</svg>
