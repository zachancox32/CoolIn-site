<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1151" width="600" height="1151" font-family="Arial, Helvetica, sans-serif">
<title>UK air conditioning in numbers, 2027. Chart by CoolIn, cool-in.co.uk/air-conditioning-statistics-2027</title>
<rect width="600" height="1151" fill="#FFFFFF"/><rect width="600" height="8" fill="#0E6E96"/>
<text x="32" y="64" font-size="30" font-weight="700" fill="#12262F">UK air conditioning in numbers,</text><text x="32" y="99" font-size="30" font-weight="700" fill="#12262F">2027</text><text x="32" y="132" font-size="19" fill="#41606E">Who has it, who goes without, and what changes next</text><text x="32" y="157" font-size="19" fill="#41606E">year</text>
<g transform="translate(0,187)"><text x="32" y="57" font-size="44" font-weight="700" letter-spacing="-1" fill="#E2673B">4.3%</text>
<text x="32" y="91" font-size="18" fill="#41606E">of homes in England use</text><text x="32" y="116" font-size="18" fill="#41606E">air conditioning. About</text><text x="32" y="141" font-size="18" fill="#41606E">1.06 million.</text>
<line x1="300" x2="300" y1="18" y2="177" stroke="#E1EAEF" stroke-width="2"/>
<text x="322" y="57" font-size="44" font-weight="700" letter-spacing="-1" fill="#0D2B38">2.5%</text>
<text x="322" y="91" font-size="18" fill="#41606E">in the North West,</text><text x="322" y="116" font-size="18" fill="#41606E">including Manchester.</text><text x="322" y="141" font-size="18" fill="#41606E">Roughly 80,000 homes.</text><text x="322" y="166" font-size="18" fill="#41606E">London: 6.5%.</text>
<line x1="32" x2="568" y1="191" y2="191" stroke="#E1EAEF" stroke-width="2"/>
<text x="32" y="249" font-size="44" font-weight="700" letter-spacing="-1" fill="#0D2B38">125,000</text>
<text x="32" y="283" font-size="18" fill="#41606E">more North West homes</text><text x="32" y="307" font-size="18" fill="#41606E">would have it at London&#x27;s</text><text x="32" y="332" font-size="18" fill="#41606E">rate.</text>
<line x1="300" x2="300" y1="209" y2="369" stroke="#E1EAEF" stroke-width="2"/>
<text x="322" y="249" font-size="44" font-weight="700" letter-spacing="-1" fill="#0D2B38">7 in 10</text>
<text x="322" y="283" font-size="18" fill="#41606E">of the North West&#x27;s</text><text x="322" y="307" font-size="18" fill="#41606E">warmest summers since</text><text x="322" y="332" font-size="18" fill="#41606E">1884 came in 2003 or</text><text x="322" y="357" font-size="18" fill="#41606E">later.</text>
<line x1="32" x2="568" y1="383" y2="383" stroke="#E1EAEF" stroke-width="2"/>
<text x="32" y="440" font-size="44" font-weight="700" letter-spacing="-1" fill="#0D2B38">7%</text>
<text x="32" y="474" font-size="18" fill="#41606E">of households whose home</text><text x="32" y="499" font-size="18" fill="#41606E">overheated used air</text><text x="32" y="524" font-size="18" fill="#41606E">conditioning. 90% opened</text><text x="32" y="548" font-size="18" fill="#41606E">a window.</text>
<line x1="300" x2="300" y1="401" y2="560" stroke="#E1EAEF" stroke-width="2"/>
<text x="322" y="440" font-size="44" font-weight="700" letter-spacing="-1" fill="#0D2B38">3x</text>
<text x="322" y="474" font-size="18" fill="#41606E">as likely to have it in</text><text x="322" y="499" font-size="18" fill="#41606E">the richest fifth of</text><text x="322" y="524" font-size="18" fill="#41606E">homes as the poorest:</text><text x="322" y="548" font-size="18" fill="#41606E">8.2% against 2.5%.</text>
<line x1="32" x2="568" y1="574" y2="574" stroke="#E1EAEF" stroke-width="2"/>
<text x="32" y="631" font-size="44" font-weight="700" letter-spacing="-1" fill="#0D2B38">1.68m</text>
<text x="32" y="665" font-size="18" fill="#41606E">homes in England could be</text><text x="32" y="690" font-size="18" fill="#41606E">using it by summer 2027.</text><text x="32" y="715" font-size="18" fill="#41606E">Up to 1 in 15.</text>
<line x1="300" x2="300" y1="592" y2="776" stroke="#E1EAEF" stroke-width="2"/>
<text x="322" y="631" font-size="44" font-weight="700" letter-spacing="-1" fill="#0D2B38">No ban</text>
<text x="322" y="665" font-size="18" fill="#41606E">on air conditioning in</text><text x="322" y="690" font-size="18" fill="#41606E">Great Britain in 2027.</text><text x="322" y="715" font-size="18" fill="#41606E">The EU&#x27;s applies in the</text><text x="322" y="740" font-size="18" fill="#41606E">EU and Northern Ireland</text><text x="322" y="765" font-size="18" fill="#41606E">only.</text></g>
<line x1="32" y1="1000" x2="568" y2="1000" stroke="#E1EAEF" stroke-width="2"/>
<text x="32" y="1031" font-size="17" fill="#6E8592">Source: EDRC analysis of the English Housing Survey</text><text x="32" y="1054" font-size="17" fill="#6E8592">2023-24; English Housing Survey 2024 to 2025; Met Office</text><text x="32" y="1078" font-size="17" fill="#6E8592">HadUK-Grid; ONS Census 2021; DEFRA; CoolIn projection</text>
<text x="32" y="1102" font-size="17" font-weight="700" fill="#0E6E96">Chart by CoolIn,</text><text x="32" y="1126" font-size="17" font-weight="700" fill="#0E6E96">cool-in.co.uk/air-conditioning-statistics-2027</text>
</svg>
