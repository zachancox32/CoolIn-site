<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 429" width="1200" height="429" font-family="Arial, Helvetica, sans-serif">
<title>Homes reporting overheating in England. Chart by CoolIn, cool-in.co.uk/air-conditioning-statistics</title>
<rect width="1200" height="429" fill="#FFFFFF"/><rect width="1200" height="8" fill="#0E6E96"/>
<text x="48" y="68" font-size="34" font-weight="700" fill="#12262F">Homes reporting overheating in England</text><text x="48" y="100" font-size="19" fill="#41606E">Homes where the household reported the home getting uncomfortably hot, millions</text>
<g transform="translate(0,130)"><defs><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#FBE7DC"/><line x1="0" y1="0" x2="0" y2="10" stroke="#E2673B" stroke-width="4"/></pattern></defs>
<text x="454" y="25" font-size="19" font-weight="400" fill="#12262F" text-anchor="end">2019</text>
<rect x="470" y="6" width="485.1" height="26" rx="4" fill="#D7EDF7" opacity=".45"/>
<rect x="470" y="6" width="218.2" height="26" rx="4" fill="#0E6E96"/>
<text x="700.2" y="26" font-size="19" font-weight="700" fill="#12262F">1.7 million (7%)</text>
<text x="454" y="71" font-size="19" font-weight="700" fill="#12262F" text-anchor="end">2024</text>
<rect x="470" y="52" width="485.1" height="26" rx="4" fill="#D7EDF7" opacity=".45"/>
<rect x="470" y="52" width="385.0" height="26" rx="4" fill="#E2673B"/>
<text x="867.0" y="72" font-size="19" font-weight="700" fill="#12262F">3.0 million (12%)</text>
<text x="454" y="117" font-size="19" font-weight="400" fill="#12262F" text-anchor="end">2027 if the trend continues</text>
<rect x="470" y="98" width="485.1" height="26" rx="4" fill="#D7EDF7" opacity=".45"/>
<rect x="470" y="98" width="485.1" height="26" rx="4" fill="url(#hatch)" stroke="#E2673B" stroke-width="2"/>
<text x="967.1" y="118" font-size="19" font-weight="700" fill="#12262F">about 3.8 million</text></g>
<text x="48" y="294" font-size="16" fill="#6E8592">The 2027 bar is our straight line projection of the 2019 to 2024 rise, not an official figure. Overheating also depends on how hot</text><text x="48" y="317" font-size="16" fill="#6E8592">a given summer is.</text>
<line x1="48" y1="345" x2="1152" y2="345" stroke="#E1EAEF" stroke-width="2"/>
<text x="48" y="375" font-size="16" fill="#6E8592">Source: English Housing Survey 2024 to 2025, MHCLG</text>
<text x="48" y="398" font-size="16" font-weight="700" fill="#0E6E96">Chart by CoolIn, cool-in.co.uk/air-conditioning-statistics</text>
<g transform="translate(962,361.3) scale(1.342)" fill="none" stroke="#0E6E96" stroke-width="1.6" stroke-linecap="round"><path d="M12 2v20"/><path d="M3.3 7 20.7 17"/><path d="M20.7 7 3.3 17"/><path d="M12 6 9.4 3.4M12 6l2.6-2.6M12 18l-2.6 2.6M12 18l2.6 2.6"/><path d="m17.1 9 3.2-.9M17.1 9l.9 3.2M6.9 15l-3.2.9M6.9 15 6 11.8"/><path d="m17.1 15 3.2.9M17.1 15l.9-3.2M6.9 9l-3.2-.9M6.9 9 6 12.2"/></g><text x="1000" y="387.9" font-size="28" font-weight="900" letter-spacing="1" fill="#0D2B38">COOLIN</text>
</svg>
