# Netlify configuration for the CoolIn site.
# The HTML in the repo root is what gets served. The build only regenerates
# the pages that come from markdown, plus the sitemap and the model files.

[build]
  publish = "."
  # Blog and case studies from markdown, then the sitemap and model files from
  # whatever those produced. python3 is in the Netlify build image by default,
  # so there is nothing to install.
  command = "python3 tools/build-blog.py && python3 tools/build-sectors.py && python3 tools/build-case-studies.py && python3 tools/build-guides.py && python3 tools/bust-cache.py && python3 tools/build-redirects.py && python3 tools/build-sitemap.py && python3 tools/build-llms.py && python3 tools/build-llms-full.py && python3 tools/check-urls.py && python3 tools/indexnow.py"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[build.processing]
  skip_processing = false
  # Netlify serves the extensionless form regardless. The .html to clean 301s
  # are written explicitly into _redirects by tools/build-redirects.py, because
  # pretty_urls did not actually issue them.
  [build.processing.html]
    pretty_urls = false

# ---------------------------------------------------------------- headers

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=()"

# CSS and JS are versioned with a ?v= query string, so they can cache hard.
# Bump the version in the HTML when you change them and browsers pick it up.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Stylesheets, scripts and fonts are fetched to render a page and are never a
# search result in their own right, so they are told not to index.
#
# Images are deliberately NOT in this list. The rule used to cover the whole of
# /assets, which put X-Robots-Tag: noindex on the favicon, so Google refused to
# show it and every result carried a generic globe instead. It also suppressed
# the og-image and the logos, which are worth having in image search.
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# Brand source files: the 4000px print masters and the vector originals that
# make-logos.py builds the web assets from. They are published because Netlify
# serves the whole repo, but they are not web images and should not turn up in
# image search. Narrowing the /assets noindex made them indexable, so this puts
# them back where they were.
[[headers]]
  for = "/assets/img/brand/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# CMS source files. Netlify publishes the whole repo, so the markdown behind
# every post, case study and guide is reachable at its own address, a duplicate
# of the real page. They are build inputs, never a result.
[[headers]]
  for = "/blog/posts/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/case-studies/projects/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/guides/source/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# The root favicon, which is what Google falls back to and what browsers and
# most directory sites request without reading any HTML. Cached for a week
# rather than a year, so a brand change is not stuck in caches.
[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Pages must revalidate, or a price change sits in caches for a year.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Answer engines expect these as plain text, not as a download.
[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/llms-full.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"

# ---------------------------------------------------------------- redirects

# Host canonicalisation is left to Netlify's primary domain setting.
# Defining it here as well is what caused an apex/www redirect loop:
# netlify.toml forced apex to www while Netlify forced www to apex.

# Collapse the one chained entry point. Netlify upgrades http to https first,
# then redirects www to the apex, which makes http://www a two hop journey.
# This sends it straight to the canonical host in one.
#
# Safe against the loop that a previous version of this file caused: every rule
# here points at the apex, the same direction Netlify's own primary domain
# redirect points. Nothing sends anything back to www.

[[redirects]]
  from = "http://www.cool-in.co.uk/*"
  to = "https://cool-in.co.uk/:splat"
  status = 301
  force = true

# /index.html and / served the same page at two URLs, and every internal link
# pointed at the first while the canonical tag pointed at the second. The links
# are fixed; this stops the duplicate URL being reachable at all.

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# ---------------------------------------------------------------- not public

# Everything in the publish directory is addressable by URL. These are in the
# repo for maintenance and have no business being served. force = true makes
# the rule win over the file that is actually sitting there.

[[redirects]]
  from = "/tools/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.claude/*"
  to = "/404.html"
  status = 404
  force = true
