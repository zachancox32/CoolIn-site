# Netlify configuration for the CoolIn site.
# There is no build step: the HTML in the repo root is what gets served.

[build]
  publish = "."
  # No build command on purpose. The HTML in the repo root is what gets served.

[build.processing]
  skip_processing = false

# Keep .html on the URL rather than letting Netlify strip it, so the canonical
# tag, the internal links and the served URL are all the same string.
[build.processing.html]
  pretty_urls = false

# ---------------------------------------------------------------- headers

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=()"

# CSS and JS are versioned with a ?v= query string, so they can cache hard.
# Bump the version in the HTML when you change them and browsers pick it up.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    # fetched to render the page, but never a search result in its own right
    X-Robots-Tag = "noindex"

# Pages must revalidate, or a price change sits in caches for a year.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Answer engines expect these as plain text, not as a download.
[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/llms-full.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"

# ---------------------------------------------------------------- redirects

# Host canonicalisation is left to Netlify's primary domain setting.
# Defining it here as well is what caused an apex/www redirect loop:
# netlify.toml forced apex to www while Netlify forced www to apex.

# Collapse the one chained entry point. Netlify upgrades http to https first,
# then redirects www to the apex, which makes http://www a two hop journey.
# This sends it straight to the canonical host in one.
#
# Safe against the loop that a previous version of this file caused: every rule
# here points at the apex, the same direction Netlify's own primary domain
# redirect points. Nothing sends anything back to www.

[[redirects]]
  from = "http://www.cool-in.co.uk/*"
  to = "https://cool-in.co.uk/:splat"
  status = 301
  force = true

# ---------------------------------------------------------------- not public

# Everything in the publish directory is addressable by URL. These are in the
# repo for maintenance and have no business being served. force = true makes
# the rule win over the file that is actually sitting there.

[[redirects]]
  from = "/tools/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.claude/*"
  to = "/404.html"
  status = 404
  force = true
