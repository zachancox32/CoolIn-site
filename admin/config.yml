backend:
  name: github
  repo: zachancox32/CoolIn-site
  branch: main

# Where images uploaded through the CMS land
media_folder: assets/blog
public_folder: /assets/blog

publish_mode: simple

collections:
  - name: posts
    label: Articles
    label_singular: Article
    folder: blog/posts
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    summary: "{{title}} ({{date}})"
    sortable_fields: [date, title]
    fields:
      - { name: title, label: Title, widget: string, hint: "Lead with the question someone would type into Google" }
      - { name: seo_title, label: Search result title, widget: string, required: false, hint: "Optional. Use a shorter version if the title above is long. Keep it under 50 characters, because CoolIn is appended." }
      - { name: description, label: Meta description, widget: text, hint: "120 to 160 characters. This is the line that appears under the title in search results." }
      - { name: date, label: Date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - name: category
        label: Category
        widget: select
        default: Installation
        hint: "Shows on the card. Keep the list short so the blog stays scannable."
        options: [Running costs, Installation, Heating, Servicing, Regulations, Commercial]
      - { name: author, label: Author, widget: relation, collection: authors, search_fields: [name], value_field: id, display_fields: [name], required: false }
      - { name: body, label: Article, widget: markdown, hint: "Use ## for section headings. The page title is the h1, so do not add another." }

  - name: guides
    label: Guides
    label_singular: Guide
    description: "Permanent answers to the questions people ask Google and AI assistants. Each gets its own address with no date, is listed on its service page, and carries question markup. Anything seasonal or dated belongs in Articles instead."
    folder: guides/source
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    summary: "{{title}}"
    sortable_fields: [title, updated]
    fields:
      - { name: title, label: Question, widget: string, hint: "The question exactly as someone would type it or ask it. For example: Can I install air conditioning in a terraced house?" }
      - { name: answer, label: Short answer, widget: text, hint: "40 to 60 words. Say yes or no, or give the figure, in the first sentence. This is the passage Google and AI assistants quote, so it has to make sense on its own." }
      # One input per fact. A bare list can be edited as comma separated text,
      # which would split "from £1,850 fitted, two rooms from..." into two items.
      - name: key_facts
        label: Key facts
        label_singular: Fact
        widget: list
        required: false
        hint: "Three to six one line facts, with real numbers where you have them."
        field: { name: fact, label: Fact, widget: string }
      - name: service
        label: Service it relates to
        widget: select
        hint: "The guide is listed on this service page and links back to it."
        options:
          - { label: "Home air conditioning", value: domestic }
          - { label: "Commercial", value: commercial }
          - { label: "Servicing", value: servicing }
          - { label: "Repairs", value: repairs }
          - { label: "Heat pumps", value: heat-pumps }
          - { label: "Ventilation", value: ventilation }
      - { name: seo_title, label: Search result title, widget: string, required: false, hint: "Optional. Under 50 characters, because CoolIn is added. Leave blank to use the question." }
      - { name: description, label: Meta description, widget: text, required: false, hint: "Optional, 120 to 160 characters. Leave blank and the short answer is used." }
      - { name: author, label: Author, widget: relation, collection: authors, search_fields: [name], value_field: id, display_fields: [name], required: false }
      - { name: updated, label: Last reviewed, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", hint: "Not shown on the page. Tells Google when the answer was last checked, so update it when you review the guide." }
      - name: faqs
        label: Follow up questions
        widget: list
        required: false
        hint: "Two to five questions people ask next. Each one is marked up for Google and AI assistants."
        summary: "{{fields.question}}"
        label_singular: Question
        fields:
          - { name: question, label: Question, widget: string }
          - { name: answer, label: Answer, widget: text }
      - { name: body, label: Full answer, widget: markdown, hint: "Use ## for each part of the answer, phrased as a question where it fits. The question above is the h1, so do not add another." }

  - name: case_studies
    label: Case studies
    label_singular: Case study
    folder: case-studies/projects
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    media_folder: /assets/case-studies
    public_folder: /assets/case-studies
    summary: "{{title}} ({{town}})"
    sortable_fields: [date, title, town]
    fields:
      - { name: title, label: Title, widget: string, hint: "What it was, in plain words. For example: Three bedroom semi in Didsbury" }
      - { name: seo_title, label: Search result title, widget: string, required: false, hint: "Optional. A shorter version for Google, under 50 characters, because CoolIn is added on the end." }
      - { name: description, label: Short summary, widget: text, hint: "120 to 160 characters. Shows on the case studies page and under the title in Google." }
      - { name: date, label: Date completed, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - name: town
        label: Town
        widget: select
        hint: "Links the case study to that town page, which is what makes it useful for local search."
        options:
            - Altrincham
            - Ashton under Lyne
            - Blackburn
            - Bolton
            - Bury
            - Chester
            - Crewe
            - Lancaster
            - Leigh
            - Liverpool
            - Macclesfield
            - Manchester
            - Northwich
            - Oldham
            - Preston
            - Rochdale
            - Salford
            - Southport
            - Stockport
            - Warrington
            - Wigan
            - Wilmslow
      - { name: property_type, label: Property type, widget: select, options: [Home, Commercial] }
      - { name: system, label: System fitted, widget: string, required: false, hint: "For example: Daikin Perfera multi split, three indoor units" }
      - { name: rooms, label: Rooms covered, widget: string, required: false, hint: "For example: Two bedrooms and a home office" }
      - { name: duration, label: Time on site, widget: string, required: false, hint: "For example: Two days" }
      - { name: guide_price, label: Guide price, widget: string, required: false, hint: "Optional. Always say guide price, installed. For example: Guide price 4,200 installed" }
      - { name: image, label: Main photo, widget: image, required: false, choose_url: false }
      - { name: brief, label: The brief, widget: markdown, hint: "What the customer wanted and what the property was like." }
      - { name: work, label: What we did, widget: markdown, hint: "The system, where the units went, anything awkward and how it was solved." }
      - { name: result, label: The result, widget: markdown, required: false, hint: "What it is like to live with. Running costs, noise, how the rooms feel." }
      - { name: gallery, label: More photos, widget: list, required: false, field: { name: image, label: Photo, widget: image } }
      - { name: customer_quote, label: Customer quote, widget: text, required: false, hint: "Only if the customer actually said it and is happy for it to be used." }
      - { name: customer_name, label: Customer name, widget: string, required: false, hint: "First name and area is plenty, for example: Sarah, Didsbury" }

  - name: authors
    label: Authors
    folder: blog/authors
    create: true
    extension: json
    format: json
    identifier_field: name
    fields:
      - { name: id, label: "ID (lowercase, hyphens, no spaces)", widget: string }
      - { name: name, label: Name, widget: string }
      - { name: role, label: Role, widget: string, required: false }
      - { name: bio, label: Short bio, widget: text, required: false }
      - { name: credentials, label: Credentials, widget: list, required: false, hint: "One per line, e.g. F-Gas certified. Only list what is actually held." }
      - { name: linkedin, label: LinkedIn URL, widget: string, required: false }
